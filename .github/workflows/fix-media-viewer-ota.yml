name: OTA-safe media viewer repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-media-viewer-ota.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove native screen-capture dependency from current OTA viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/(app)/vault-viewer.tsx')
          s = p.read_text()
          s = s.replace("import { useProtectedScreenCapture } from '@/hooks/useProtectedScreenCapture';\n", '')
          s = s.replace("  useProtectedScreenCapture(!!activeItem && !activeItem.allowScreenshot);\n", '')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run typecheck
      - name: Commit repair and remove one-time workflow
        run: |
          rm .github/workflows/fix-media-viewer-ota.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(app)/vault-viewer.tsx' .github/workflows/fix-media-viewer-ota.yml
          git commit -m 'fix: restore OTA-safe full-screen media viewer'
          git push
