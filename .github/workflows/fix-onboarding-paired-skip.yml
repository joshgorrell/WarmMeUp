name: Fix paired onboarding flow

on:
  push:
    branches: [fix/onboarding-paired-skip]
    paths: ['.github/workflows/fix-onboarding-paired-skip.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-paired-skip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
      - run: npm ci
      - name: Apply paired onboarding fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Onboarding screen: use current couple state for UI, refresh it on entry,
          # and authoritatively re-check pairing before deciding whether to send a
          # completed user to the Pair screen.
          p = Path('app/(auth)/onboarding.tsx')
          s = p.read_text()
          s = s.replace(
              "import React, { useCallback, useRef, useState } from 'react';",
              "import React, { useCallback, useEffect, useRef, useState } from 'react';"
          )
          s = s.replace(
              "  const { user, refreshProfile, refreshSettings } = useAuth();",
              "  const { user, couple, refreshCouple, refreshProfile, refreshSettings } = useAuth();"
          )
          marker = """  const [saveError, setSaveError] = useState(false);\n  // Preserve the user's selected finish action across a failed save + retry\n"""
          replacement = """  const [saveError, setSaveError] = useState(false);\n  const alreadyPaired = !!(couple?.active && couple?.user_b_id);\n\n  useEffect(() => {\n    if (user) refreshCouple().catch(() => {});\n  }, [user?.id, refreshCouple]);\n\n  // Preserve the user's selected finish action across a failed save + retry\n"""
          if marker not in s:
              raise SystemExit('onboarding state marker not found')
          s = s.replace(marker, replacement, 1)

          old_finish = """  const finish = useCallback((action?: OnboardingFinishAction) => {\n    if (action === 'invite-partner') {\n      router.replace('/(auth)/pair');\n    } else {\n      router.replace('/(app)/(tabs)');\n    }\n  }, [router]);\n"""
          new_finish = """  const finish = useCallback((action?: OnboardingFinishAction, paired = alreadyPaired) => {\n    if (action === 'invite-partner' && !paired) {\n      router.replace('/(auth)/pair');\n    } else {\n      router.replace('/(app)/(tabs)');\n    }\n  }, [router, alreadyPaired]);\n"""
          if old_finish not in s:
              raise SystemExit('onboarding finish block not found')
          s = s.replace(old_finish, new_finish, 1)

          old_refresh = """    // Refresh in-memory state so routing uses current data\n    await Promise.all([\n      refreshProfile(),\n      refreshSettings(),\n    ]);\n\n    finish(pendingActionRef.current);\n  }, [completing, user, refreshProfile, refreshSettings, finish, router]);\n"""
          new_refresh = """    // Refresh in-memory state so routing uses current data.\n    await Promise.all([\n      refreshProfile(),\n      refreshSettings(),\n      refreshCouple(),\n    ]);\n\n    // Pairing and account creation are separate flows. A user who already accepted\n    // an invite must never be sent back to Pair and asked for an invite code again.\n    // Check the database directly here so this decision does not depend on stale\n    // React context immediately after User B completes a join.\n    const { data: activeCouple } = await supabase\n      .from('couples')\n      .select('id, user_b_id, active')\n      .eq('active', true)\n      .or(`user_a_id.eq.${user.id},user_b_id.eq.${user.id}`)\n      .not('user_b_id', 'is', null)\n      .limit(1)\n      .maybeSingle();\n\n    const pairedNow = !!activeCouple?.user_b_id || alreadyPaired;\n    finish(pendingActionRef.current, pairedNow);\n  }, [completing, user, alreadyPaired, refreshCouple, refreshProfile, refreshSettings, finish, router]);\n"""
          if old_refresh not in s:
              raise SystemExit('onboarding refresh block not found')
          s = s.replace(old_refresh, new_refresh, 1)
          s = s.replace(
              '  return <OnboardingCarousel mode="post-auth" onComplete={handleComplete} />;',
              '  return <OnboardingCarousel mode="post-auth" alreadyPaired={alreadyPaired} onComplete={handleComplete} />;'
          )
          p.write_text(s)

          # Carousel: if pairing already happened, make the final screen and CTA
          # reflect that state and finish into the app instead of Pair.
          p = Path('components/OnboardingCarousel.tsx')
          s = p.read_text()
          s = s.replace(
              "interface Props {\n  mode: OnboardingMode;\n  onComplete: (action?: OnboardingFinishAction) => void;\n}",
              "interface Props {\n  mode: OnboardingMode;\n  alreadyPaired?: boolean;\n  onComplete: (action?: OnboardingFinishAction) => void;\n}"
          )
          s = s.replace(
              "function VisualFinish() {",
              "function VisualFinish({ alreadyPaired = false }: { alreadyPaired?: boolean }) {"
          )
          s = s.replace(
              "          <AppText style={styles.finishInviteTitle}>One subscription. Both of you.</AppText>\n          <AppText style={styles.finishInviteSub}>\n            Invite your partner and make the space yours.\n          </AppText>",
              "          <AppText style={styles.finishInviteTitle}>One subscription. Both of you.</AppText>\n          <AppText style={styles.finishInviteSub}>\n            {alreadyPaired ? 'You’re connected. Your private space is ready.' : 'Invite your partner and make the space yours.'}\n          </AppText>"
          )
          s = s.replace(
              "export default function OnboardingCarousel({ mode, onComplete }: Props) {",
              "export default function OnboardingCarousel({ mode, alreadyPaired = false, onComplete }: Props) {"
          )
          s = s.replace(
              "    () => onComplete(mode === 'preview' ? 'get-started' : 'invite-partner'),\n    [mode, onComplete],",
              "    () => onComplete(mode === 'preview' || alreadyPaired ? 'get-started' : 'invite-partner'),\n    [mode, alreadyPaired, onComplete],"
          )
          s = s.replace(
              "                    <Visual />",
              "                    {item.key === 'finish' ? <VisualFinish alreadyPaired={alreadyPaired} /> : <Visual />}"
          )
          s = s.replace(
              "                  : 'Connect My Partner'",
              "                  : alreadyPaired ? 'Enter Warm Me Up' : 'Connect My Partner'"
          )
          # Dynamic finish slide subtext so paired users are never told to connect again.
          s = s.replace(
              "                  <AppText style={styles.subtext}>{item.subtext}</AppText>",
              "                  <AppText style={styles.subtext}>\n                    {item.key === 'finish' && alreadyPaired\n                      ? 'You and your partner are connected. Your private space is ready — jump in and start exploring together.'\n                      : item.subtext}\n                  </AppText>"
          )
          p.write_text(s)
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Verify targeted behavior
        run: |
          grep -q "alreadyPaired={alreadyPaired}" 'app/(auth)/onboarding.tsx'
          grep -q "A user who already accepted" 'app/(auth)/onboarding.tsx'
          grep -q "Enter Warm Me Up" components/OnboardingCarousel.tsx
          grep -q "You’re connected. Your private space is ready." components/OnboardingCarousel.tsx
      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-onboarding-paired-skip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Skip partner invite for already paired users'
          git push origin fix/onboarding-paired-skip
