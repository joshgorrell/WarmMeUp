name: Fix Babel preset and verify Expo bundle

on:
  push:
    branches:
      - fix/babel-preset-eas

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/babel-preset-eas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install SDK 54 Babel preset
        run: npm install --save-dev babel-preset-expo@~54.0.12

      - name: Clean install from regenerated lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Verify iOS production export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://vdhrcbaggplcktjamwcj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CI: 1
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Commit verified dependency fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-babel-preset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/fix-babel-preset.yml
          git commit -m "Add missing Expo Babel preset and verify iOS bundle"
          git push origin HEAD:fix/babel-preset-eas
