name: Media regression checks

on:
  pull_request:
    paths:
      - 'lib/uploadMedia.ts'
      - 'lib/videoDurationPolicy.ts'
      - 'scripts/test-video-duration.cjs'
      - 'scripts/test-video-upload-policy.cjs'
      - 'lib/videoUploadPolicy.ts'
      - 'lib/tusUploadPolicy.ts'
      - 'lib/tusUploadSession.ts'
      - 'scripts/test-tus-policy.cjs'
      - 'scripts/test-tus-session.cjs'
      - 'scripts/test-upload-progress.cjs'
      - 'lib/mediaRetryPolicy.ts'
      - 'scripts/test-media-retry.cjs'
      - 'lib/uploadProgress.ts'
      - 'components/note/**'
      - 'app/(app)/vault-viewer.tsx'
      - 'app/(app)/camera-capture.tsx'
      - 'app/(app)/(tabs)/note.tsx'
      - 'app/(app)/(tabs)/vault.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/media-checks.yml'
  push:
    branches: [main]
    paths:
      - 'lib/uploadMedia.ts'
      - 'lib/videoDurationPolicy.ts'
      - 'scripts/test-video-duration.cjs'
      - 'scripts/test-video-upload-policy.cjs'
      - 'lib/videoUploadPolicy.ts'
      - 'lib/tusUploadPolicy.ts'
      - 'lib/tusUploadSession.ts'
      - 'scripts/test-tus-policy.cjs'
      - 'scripts/test-tus-session.cjs'
      - 'scripts/test-upload-progress.cjs'
      - 'lib/mediaRetryPolicy.ts'
      - 'scripts/test-media-retry.cjs'
      - 'components/note/**'
      - 'app/(app)/vault-viewer.tsx'
      - '.github/workflows/media-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Media gesture regression guard
        run: node scripts/check-media-gestures.cjs
      - name: Media retry behavioral tests
        run: node scripts/test-media-retry.cjs
      - name: Video duration boundary tests
        run: node scripts/test-video-duration.cjs
      - name: Adaptive video upload timeout tests
        run: node scripts/test-video-upload-policy.cjs
      - name: TUS protocol boundary tests
        run: node scripts/test-tus-policy.cjs
      - name: TUS resume session tests
        run: node scripts/test-tus-session.cjs
      - name: Upload progress lifecycle tests
        run: node scripts/test-upload-progress.cjs
