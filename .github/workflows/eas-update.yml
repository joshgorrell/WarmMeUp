name: EAS Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://vdhrcbaggplcktjamwcj.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        run: |
          set -euxo pipefail
          node --version
          npm --version
          npx eas --version
          npx expo --version
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          grep -R "V15 OTA LIVE TEST" lib/appVersion.ts || echo "MARKER NOT FOUND IN lib/appVersion.ts"

      - name: Publish EAS Update
        run: |
          set -euxo pipefail
          npx eas whoami
          npx eas update --channel production --message "V15 OTA live test 2026-06-15" --non-interactive
