name: EAS Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Validate Supabase anon key
        env:
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e "const k=process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY||''; console.log('anon len', k.length); console.log('anon prefix', k.slice(0,24)); try { const payload=JSON.parse(Buffer.from(k.split('.')[1], 'base64url').toString()); console.log('payload ref', payload.ref); console.log('payload role', payload.role); } catch(e) { console.log('decode failed', e.message); process.exit(1); }"

      - name: Check OTA marker
        run: grep -R "OTA_MARKER" lib/appVersion.ts

      - name: Publish OTA update to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: https://vdhrcbaggplcktjamwcj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          MARKER=$(grep OTA_MARKER lib/appVersion.ts | head -1)
          eas update --branch production --message "$MARKER" --non-interactive
