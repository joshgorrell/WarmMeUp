name: EAS Update

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: false
          eas-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "=== Runtime versions ==="
          node --version
          npm --version
          npx eas --version
          npx expo --version
          echo "=== Git context ==="
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "=== Workspace files ==="
          ls -la
          echo "=== eas.json update block ==="
          cat eas.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d.get('update', 'NOT FOUND'), indent=2))"
          echo "=== OTA marker in source ==="
          grep -r "V15 OTA LIVE TEST" lib/appVersion.ts || echo "MARKER NOT FOUND"
          echo "=== EXPO_PUBLIC_SUPABASE_URL present? ==="
          [ -n "${EXPO_PUBLIC_SUPABASE_URL}" ] && echo "YES (${#EXPO_PUBLIC_SUPABASE_URL} chars)" || echo "NO - MISSING"
          echo "=== EAS auth check ==="
          npx eas whoami

      - name: Publish EAS Update
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euxo pipefail
          npx eas update --channel production --message "V15 OTA live test 2026-06-15" --non-interactive
