name: EAS Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check Node
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Check EAS CLI
        run: eas --version

      - name: Check Expo auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Check Expo config
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://vdhrcbaggplcktjamwcj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo config --type public

      - name: Check OTA marker
        run: grep -R "OTA_MARKER" lib/appVersion.ts

      - name: Create main branch and publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: https://vdhrcbaggplcktjamwcj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: eas update --branch main --message "OTA update $(grep OTA_MARKER lib/appVersion.ts | head -1)" --non-interactive

      - name: List EAS branches
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas branch:list

      - name: List EAS channels
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas channel:list

      - name: Map production channel to main branch
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas channel:edit production --branch main --non-interactive

      - name: Verify channel mapping
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas channel:view production
