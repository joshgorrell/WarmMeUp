name: EAS build readiness audit

on:
  push:
    branches: [fix/eas-build-readiness]
    paths: ['.github/workflows/eas-build-readiness.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eas-build-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Align Expo SDK 54 dependencies
        run: npx expo install --fix
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Verify key build settings
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['expo-video']!=='~3.0.16') process.exit(1); if(p.dependencies['expo-clipboard']!=='~8.0.8') process.exit(1); const e=require('./eas.json'); if(e.build.production.node!=='22.13.0') process.exit(1); const a=require('./app.json'); if(a.expo.runtimeVersion!=='1.1.0') process.exit(1); if(a.expo.ios.bundleIdentifier!=='app.warmmeup') process.exit(1); console.log('Build settings verified')"
      - name: Commit dependency alignment and remove temporary workflow
        run: |
          rm .github/workflows/eas-build-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/eas-build-readiness.yml
          git commit -m 'Align SDK 54 dependencies and verify EAS build readiness'
          git push origin fix/eas-build-readiness
