name: Run Dice Polish

on:
  push:
    branches: [main]
    paths:
      - '.dice-polish-trigger'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Dice polish script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w = Path('.github/workflows/one-time-dice-polish.yml').read_text()
          block = w.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(script, 'dice-polish', 'exec'))
          PY
      - name: Install and typecheck
        run: |
          npm ci
          npm run typecheck
      - name: Commit polished Dice page
        run: |
          rm -f .dice-polish-trigger
          rm -f .github/workflows/one-time-dice-polish.yml
          rm -f .github/workflows/run-dice-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Dice page and align history cards"
          git push
