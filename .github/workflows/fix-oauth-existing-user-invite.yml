name: Fix OAuth invite redemption
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oauth-existing-user-invite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: |
          python3 .github/scripts/fix_oauth_invite.py
      - run: npm run typecheck
      - name: Commit
        run: |
          rm .github/workflows/fix-oauth-existing-user-invite.yml
          rm .github/scripts/fix_oauth_invite.py
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Redeem invites for returning OAuth users"
          git push origin fix/oauth-existing-user-invite
