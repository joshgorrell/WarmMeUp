name: Fix signup and pairing flow

on:
  push:
    branches:
      - fix/signup-pairing-flow
    paths:
      - .github/workflows/fix-signup-pairing-flow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/signup-pairing-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
      - run: npm ci
      - name: Apply signup flow fixes
        run: python3 scripts/fix_signup_pairing_flow.py
      - name: Typecheck
        run: npm run typecheck
      - name: Verify changes
        run: |
          grep -q "tos_accepted_at: nowIso" 'app/(auth)/register.tsx'
          grep -q "refreshCouple" 'app/(auth)/verify-email.tsx'
          grep -q "native email-verification deep links" app/auth/callback.tsx
          grep -q "Sign in with Apple could not verify this app" lib/oauth.ts
      - name: Commit fixes and remove temporary files
        run: |
          rm .github/workflows/fix-signup-pairing-flow.yml scripts/fix_signup_pairing_flow.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix signup verification and pairing flow'
          git push origin fix/signup-pairing-flow
